[project]
name = "endurance"
version = "0.1.0"
description = "Welcome to Enduance"
readme = "README.md"
authors = [
    { name = "Brian Staber", email = "brian.staber@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "cupy-cuda12x>=13.6.0",
    "hetgpy>=1.0.4",
    "hydra-core>=1.3.2",
    "neuraloperator==2.0.0",
    "nvidia-physicsnemo>=1.2.0",
    "plaid-bridges",
    "pyplaid>=0.1.8",
    "pyqt5>=5.15.11",
    "pytest>=8.4.2",
    "pyvista>=0.46.3",
    "rich>=14.1.0",
    "scikit-learn>=1.7.2",
    "snakeviz>=2.2.2",
    "tensorboard>=2.20.0",
    "the-well>=1.1.0",
    "torch<=2.8.0",
    "torch-geometric>=2.6.1",
    "torch-scatter==2.1.2+pt28cu129",
    "torch-tb-profiler>=0.4.3",
    "warp-lang>=1.9.0",
    "timm>=1.0,<2",
    "wandb>=0.22.3",
    "torch-harmonics>=0.8.0",
    "mlflow>=3.5.1",
    "open3d>=0.19.0",
    "peft>=0.17.1",
    "bitsandbytes>=0.48.2",
]

[tool.uv.workspace]
members = [
    "apps/*",
    "libs/*",
]

[tool.uv.sources]
"dummy-lib" = { workspace = true }
"mini-rnn" = { workspace = true }
plaid-bridges = { git = "https://github.com/PLAID-lib/plaid-bridges.git" }

[build-system]
requires = ["uv_build>=0.9.1,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "htmlmin2>=0.1.13",
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-include-markdown-plugin>=7.1.7",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-material>=9.6.18",
    "mkdocs-section-index>=0.3.10",
    "mkdocstrings[python]>=0.30.0",
    "pre-commit>=4.3.0",
    "pyright>=1.1.405",
    "pytest>=8.4.1",
    "ruff>=0.12.11",
]

[tool.uv]
find-links = [
    "https://data.pyg.org/whl/torch-2.8.0+cu129.html",
]

[tool.ruff]
line-length = 88
exclude = ["doc", "benchmark"]

[tool.ruff.lint]
select = [
  "D",
  "E", "W",
  "F",
  "ARG",
  "I",
]
ignore = [
  "E501",
  "F821", # jaxtyping
  "F722",  # jaxtyping
  "D107" # missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"*tests/*" = ["D", "S101"]
"__init__.py" = ["D104", "F401"]
